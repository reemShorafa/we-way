<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <link rel="icon" type="image/webp" href="%PUBLIC_URL%/logo.webp" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <meta name="theme-color" content="#ffffff" />

    <meta
      name="description"
      content="WeWay - Plan, track, and enjoy your trips together."
    />

    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo.webp" />

    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <title>WeWay</title>
    <script>
      (function () {
        var language = localStorage.getItem('weway-language');

        if (language !== 'ar' && language !== 'en') {
          language = 'ar';
        }

        document.documentElement.lang = language;
        document.documentElement.dir = language === 'ar' ? 'rtl' : 'ltr';
      })();
    </script>
  </head>

  <body>
    <noscript> You need to enable JavaScript to run this app. </noscript>

    <div id="root"></div>
  </body>
</html>
